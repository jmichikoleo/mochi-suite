{% extends "base.html" %}

{% block content %}
<div class="upload-box">
    <h2>Upload your presentation</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept=".pdf" required>
        <br><br>
        <button type="submit">Analyze</button>
    </form>
</div>
{% endblock %}

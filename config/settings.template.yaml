# Mochi's Assistant - Settings
# ============================

# Slack Incoming Webhook URL
# Follow README.md for setup instructions
slack:
  webhook_url: "YOUR_SLACK_WEBHOOK_URL_HERE"
  enabled: true

# Timezone
timezone: "Asia/Seoul"  # KST (UTC+9)

# Data paths (relative to project root)
paths:
  tasks: "data/tasks.json"
  habits: "data/habits.json"
  metrics: "data/metrics.json"
  paper_history: "data/paper_history.json"
  briefings_dir: "data/briefings"

# News RSS feeds
news:
  political:
    - name: "Reuters World"
      url: "https://feeds.reuters.com/Reuters/worldNews"
    - name: "AP News"
      url: "https://rsshub.app/apnews/topics/apf-topnews"
    - name: "BBC World"
      url: "http://feeds.bbci.co.uk/news/world/rss.xml"
  finance:
    korean:
      - name: "Nikkei Asia"
        url: "https://asia.nikkei.com/rss/feed/nar"
      - name: "KBS World Economy"
        url: "https://world.kbs.co.kr/rss/rss_news.htm?lang=e&vMajor=economy"
      - name: "Investing.com Korea"
        url: "https://www.investing.com/rss/news_301.rss"
    indonesian:
      - name: "CNBC Indonesia"
        url: "https://www.cnbcindonesia.com/rss"
    american:
      - name: "CNBC Top News"
        url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
      - name: "Yahoo Finance"
        url: "https://finance.yahoo.com/news/rssindex"

# Paper search
papers:
  max_daily: 2
  search_queries:
    - "LLM routing"
    - "mixture of experts language model"
    - "inference optimization large language model"
    - "AI agent framework"
    - "transformer routing mechanism"
  categories:
    - "cs.CL"   # Computation and Language
    - "cs.AI"   # Artificial Intelligence
    - "cs.LG"   # Machine Learning

# OpenAI API (for paper summarizer)
openai:
  api_key: "YOUR_OPENAI_API_KEY_HERE"
  model: "gpt-4o-mini"

# Stock portfolio
stocks:
  symbols:
    - "BUKA.JK"
    - "FILM.JK"
    - "MARI.JK"

# Additional data paths
extra_paths:
  food_log: "data/food_log.json"
  journal: "data/journal.json"
  media_log: "data/media_log.json"
  paper_summaries: "data/paper_summaries.json"
  tarot_readings: "data/tarot_readings.json"

# Weather (OpenWeatherMap)
# Get free API key at https://openweathermap.org/api
weather:
  api_key: "YOUR_OPENWEATHER_API_KEY_HERE"
  city: "Busan"
  country: "KR"

# Email Digest (Gmail)
# For Gmail: enable 2FA, then create an App Password at https://myaccount.google.com/apppasswords
email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  sender_email: "YOUR_EMAIL@gmail.com"
  sender_password: "YOUR_APP_PASSWORD"
  recipient_email: "YOUR_EMAIL@gmail.com"
